# Publishes the site on every push to main. The repo holds more than the site -
# design notes, the mockups the layout came from, the mesh exporter - and none
# of that is the site, so the artifact is assembled from the four things a
# visitor actually loads rather than from the checkout as a whole.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy already running is left to finish; queued ones collapse to the last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          set -eu
          test -f content.js || { echo "content.js is missing - it is the only copy of the words a visitor sees"; exit 1; }
          mkdir -p _site
          cp index.html content.js _site/
          cp -r assets _site/assets
          # Pages runs Jekyll over the artifact otherwise, which eats _-prefixed paths
          touch _site/.nojekyll
          ls -R _site

      - uses: actions/configure-pages@v5
        # the repo had no Pages site until the first run asked for one, and
        # without this the action reads that 404 as a failure rather than a
        # thing it can fix
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
